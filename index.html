<!DOCTYPE html>
<!---
    Program Name: Homework 4 HTML Form
    Author: sydneyguico.github.io

    version: 4.0

<html lang="en">
    <head>
        <link rel="stylesheet" href="hw4.css"> <!-- links to css file (Remember to change this for every homework assignment Hoang Le)-->
        
        <!--displays text in the browser's tab-->
        <title>New Patient Registry | Cat Medical</title>
    </head>
    <body>
        <header>
            <table width="100%">
                <tr>
                    <td valign="top" align="left" width="20%">
                        <div class="image">
                            <img align="center" src="CatMedical.jpeg" alt="Cat Medical" width="70px" id="logo"/>
                        </div>
                    </td>

                    <td>
                        <h2>Cat Medical</h2>
                    </td>

                    <td valign="bottom" align="right" width="20%">
                        Today's Date: <span id="today"></span>
                    </td>
                </tr>
            </table>
        </header>

<hr> <!--Creates welcome message for user cookie-->
<center>
    <span id="welcome1"></span>
    <span id="welcome2"></span>
</center>

<!--Insert iframe (looks like an Ad)-->
<div class="iframe-container">
    <iframe class="frame" src="https://www.houstonhumane.org/" frameborder="0"></iframe>
</div>

<!--Form starts here-->
<form name="signup" id="signup" action="thankyou.html">
    <center>
        <div class="format">
            <table>
                <tr>
                    <th colspan="4"> Create Patient Portal Account</th>
                </tr>
                <!--patient's information section of form starts here-->

                <!--Patient's name F M L-->
<tr>
    <td class="td1">
        <label for="fname">First,</label>
        <label for="mname">MI,</label>
        <label for="lname">Last:</label>
    </td>
    <td>
        <div style="display: flex; align-items: flex-start; gap: 4px;">
            <div>
                <input 
                        type="text" 
                        name="First Name" 
                        id="fname"
                        minlength="1"
                        maxlength="30" 
                        title="Letters, dashes, and apostrophes only"
                        pattern="[a-zA-Z']{1-30}"
                        onblur="validateFname()"
                        required 
                        placeholder="Sydney"
                        />
                        <br>
                        <span class="error" id="fname-error"></span>
            </div>

            <div>
               <input 
                        type="text" 
                        name="Middle Initial" 
                        id="mname"
                        minlength="0"
                        maxlength="1" 
                        title="Letters only"
                        pattern="[a-zA-Z']{0-1}"
                        onblur="validateMname()"
                        placeholder="R"
                        />
                        <br>
                        <span class="error"  id="mname-error"></span>
            </div>

            <div>
                <input type="text" 
                        name="Last Name" 
                        id="lname"
                        minlength="1"
                        maxlength="30" 
                        title="Letters, dashes, and apostrophes only"
                        pattern="[a-zA-Z']{1-30}"
                        onblur="validateLname()"
                        required 
                        placeholder="Guico"
                        />
                        <br>
                        <span class="error" id="lname-error"></span>
            </div>
        </div>
    </td>
</tr>

                <!--Gender or sex-->

                <tr>
                    <td class="td1"><label for="psex">Patient's Sex</label></td>
                    <td>
                        <input
                        type="radio"
                        id="s1"
                        name="Sex"
                        value="Male"
                        />
                        Male

                        <input
                        type="radio"
                        id="s2"
                        name="Sex"
                        value="Female"
                        />
                        Female

                        <input
                        type="radio"
                        id="s3"
                        name="Sex"
                        value="other"
                        />
                        Other

                        <input  
                        type="radio"  
                        id="s4"  
                        name="Sex"  
                        value="I prefer not to say" 
                        />  
                        I prefer not to say 

                    </td>
                </tr>

                <!--date of birth-->

                <tr>
                    <td class="td1"><label for="dob">Date of birth</label></td>
                    <td>
                        <input
                        type="date"
                        id="dob"
                        name="Date of Birth"
                        onblur="validateDob()"
                        required
                        />
                        <br>
                        <span class="error" id="dob-error"></span>
                    </td>
                </tr>

                <tr>
                    <td class="td1"><label for="ssn">Social Security Number: </label></td>
                    <td>
                        <input
                        required
                        type="password"
                        minlength="11"
                        maxlength="11"
                        name="Social Security Number"
                        id="ssn"
                        title="Numbers Only"
                        placeholder="123-88-4321"
                        onblur="validateSsn()"
                        />
                        <br>
                        <span class="error" id="ssn-error"></span>
                    </td>
                </tr>

                <tr>
                    <th colspan="4"><hr></th> <!-- This makes a line allowing it to be more organized-->
                </tr>

                <tr>
                    <th colspan="4"> Patient contact information</th>
                </tr>

                <!--Address-->

                <tr>
                    <td class="td1"><label for="address1">Address:</label></td>
                    <td>
                        <input type="text" 
                        name="Address 1" 
                        id="address1" 
                        minlength="2"
                        maxlength="30"
                        title="Letters, dashes, and apostrophes only" 
                        required 
                        placeholder="3333 Address"
                        onblur="validateAddress1()"
                        />
                        <br>
                        <span class="error" id="address1-error"></span>
                    </td>
                </tr>

                <tr>
                    <td class="td1"><label for="address2">Address:</label></td>
                    <td>
                        <input
                        type="text" 
                        name="Address 2" 
                        id="address2" 
                        minlength="2"
                        maxlength="30" 
                        title="Please enter your address"
                        placeholder="2222 Address"
                        />
                    </td>
                </tr>

                <tr>
                    <td class="td1"><label for="city">City:</label></td>
                    <td>
                        <input 
                        type="text" 
                        name="City" 
                        id="city" 
                        minlength="1"
                        maxlength="30"
                        title="Enter your city" 
                        required 
                        placeholder="Enter your city"
                        onblur="validateCity()"
                        />
                        <br>
                        <span class="error" id="city-error"></span>
                    </td>
                </tr>

                <!--All the states including DC and PR-->
                <tr>
                    <td class="td1"><label for="state">State:</label></td>
                        <td>
                            <select 
                            type="select-one"
                            required 
                            name="State" 
                            id="state" 
                            title="Please select your state"
                            placeholder="Please select your state">
                            </select>
                        </td>
                </tr>
                <tr>
                    <td class="td1"><label for="zcode">Zip Code:</label></td>
                        <td>
                            <input 
                            type="text" 
                            name="Zip Code" 
                            id="zcode" 
                            maxlength="10" 
                            pattern="[0-9]{5}"
                            title="Numbers only" 
                            required 
                            placeholder="Enter your zip code"
                            onblur="validateZcode()"
                            />
                            <br>
                            <span class="error" id="zcode-error"></span>
                        </td>
                </tr>

                <tr>
                    <td class="td1"><label for="email">Email Address:</label></td>
                        <td>
                            <input 
                            type="email" 
                            name="Email Address:" 
                            id="email"
                            maxlength="30"
                            required
                            title="Please enter your email" 
                            placeholder="sydneyguico.tp@gmail.com"
                            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,20}$"
                            onblur="validateEmail()"
                            />
                            <br>
                            <span class="error" id="email-error"></span>
                        </td>
                </tr>

                <tr>
                    <td class="td1"><label for="phonenum">Phone Number:</label></td>
                        <td>
                            <input type="text" 
                            name="Phone Number:" 
                            id="phonenum" 
                            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                            maxlength="30"
                            title="Please enter your phone number" 
                            required 
                            placeholder="123-123-1234"
                            onblur="validatePhonenum()"
                            />
                            <br>
                            <span class="error" id="phonenum-error"></span>
                        </td>
                </tr>

                <tr>
                    <th colspan="4"><hr></th> <!-- This makes a line allowing it to be more organized-->
                </tr>
                
                <!--Patient background-->

                <tr>
                    <th colspan="4">Patient's history</th>
                </tr>

                 <tr>
                    <td class="td1"><label for="vacc">Have you been vaccinated:</label></td>
                    <td>
                        <input
                        type="radio" 
                        id="v1" 
                        name="Vaccinated?" 
                        value="Yes"
                        />
                        Yes
                        <input 
                        type="radio" 
                        id="v2" 
                        name="Vaccinated?" 
                        value="No"
                        />
                        No
                    </td>
                </tr>

                <tr>
                    <td class="td1"><label for="insur">Do you have insurance:</label></td>
                    <td>
                        <input 
                        type="radio" 
                        id="i1" 
                        name="Insurance?" 
                        value="Yes"
                        /> 
                        Yes

                        <input 
                        type="radio" 
                        id="i2" 
                        name="Insurance?" 
                        value="No"
                        /> 
                        No
                    </td>
                </tr>

                <tr>
                    <td class="td1"><label for="pat_hist">Have you ever had</label></td>
                    <td>
                        <input type="checkbox" id="option1" value="COVID 19"/>
                        <label for="COVID 19">COVID 19</label>

                        <input type="checkbox" id="option2" value="Chicken Pox"/>
                        <label for="Chicken Pox">Chicken Pox</label>

                        <input type="checkbox" id="option3" value="Measles"/>
                        <label for="Measles">Measles</label><br>

                        <input type="checkbox" id="option4" value="Malaria"/>
                        <label for="Malaria">Malaria</label>

                        <input type="checkbox" id="option5" value="Pneumonia"/>
                        <label for="Pneumonia">Pneumonia</label>

                        <input type="checkbox" id="option6" value="Tetanus"/>
                        <label for="Tetanus">Tetanus</label>
                </tr>

                <tr>
                    <td class="td1" align="right">
                        <label for="notes">Describe your current symptoms</label>
                    </td>
                    <td>
                        <textarea
                        rows="4"
                        cols="50"
                        minlength="3"
                        maxlength="500"
                        id="notes"
                        name="Notes"
                        title="Reason for Visit"
                        required
                        placeholder="Please write a description on the symptoms your experiencing..."
                        ></textarea>
                        <span id="descirption_text"></span>
                    </td>
                </tr>

                <!-- Slider HTML Coding-->
                <tr>
                    <td class="td1"><label for="range">How is your health?<br/>(On a scale of 1 to 10, 10 being feeling good)</label></td>
                    <td>
                        <input
                        type="range"
                        name="Health Range"
                        id="range"
                        min="0"
                        max="10"
                        value="0"
                        />
                        <span id="range-slider"></span>
                    </td>
                </tr>

                <tr>
                    <th colspan="4"><hr></th> <!-- Webpage splitter-->
                </tr>

                <!-- Patient login Information-->
                <tr>
                    <th colspan="4">Make a Patient Account:</th>
                </tr>

                <tr>
                    <td class="td1"><label for="username">User ID:</label></td>
                    <td>
                        <input
                        type="text"
                        name="Username"
                        id="username"
                        minlength="5"
                        maxlength="20"
                        required
                        title="Username must contain at least 5 characters, and cannot start with a number"
                        placeholder="Enter your desired username"
                        onblur="validateUsername()"
                        />
                        <br>
                        <span class="error" id="username-error"></span>
                    </td>
                </tr>

                <tr>
                    <td class="td1"><label for="pass">Password:</label></td>
                    <td>
                        <input
                        type="password"
                        name="Password"
                        id="pass"
                        minlength="8"
                        maxlength="30"
                        required
                        title="Password must contain at least 8 characters, one uppercase letter, one number, one lowercase letter, and one special character"
                        placeholder="Registration"
                        onblur="validatePass()"
                        oninput="validatePass()"
                        onfocus="validatePass()"
                        />
                        </br>
                        <span class="error" id="pass1-error"></span>
                    </td>
                </tr>

                <tr>
                    <td class="td1"><label for="c_pass">Confirm Password:</label></td>
                    <td>
                        <input
                        type="password"
                        name="Confirm Password"
                        id="c_pass"
                        minlength="10"
                        maxlength="30"
                        required
                        title="Please re-enter your password"
                        placeholder="Registration"
                        onblur="confirmPass()"
                        oninput="confirmPass()"
                        onfocus="confirmPass()"
                        />
                        </br>
                        <span class="error" id="pass2-error"></span>
                    </td>
                </tr>


                <!--Inputs Check Box-->
                <tr>
                    <td class="td1">
                        <label for="remember-me">Remember Me:</label>
                    </td>
                    <td>
                        <input
                            type="checkbox"
                            id="remember-me"
                            name="Remember Me?"
                            checked
                        />
                    </td>
                </tr>


                <tr>
                    <td class="td1" colspan="4">
                    <center>
                        <input type="submit" name="submit" id="submit" style="font-family: 'Arial', Helvetica, sans-serif;">
                        &nbsp;&nbsp;&nbsp; <!--spaces between submit and reset-->
                        <input type="reset" name="reset" id="reset" style="font-family: 'Arial', Helvetica, sans-serif;">
                        &nbsp;&nbsp;&nbsp;
                        <input type="button" name="review" id="review" value="Review" style="font-family: 'Arial', Helvetica, sans-serif;" onclick="reviewInput()"> 
                        &nbsp;&nbsp;&nbsp;
                        <input type="button" name="validate" id="validate" value="Validate" style="font-family: 'Arial', Helvetica, sans-serif;" onclick="validateEverything()">   <!--executes validate javascript-->
                    </center>
                    </td>
                </tr>
            </table>
        </div>
    <!--New-->
    <div class="pass-message">
        <span id="msg1"></span> <br/>
        <span id="msg2"></span> <br/>  
        <span id="msg3"></span> <br/>  
        <span id="msg4"></span> <br/>  
        <span id="msg5"></span> <br/>  
        <span id="msg6"></span> <br/>  
        <span id="msg7"></span> <br/>  
        <span id="pass2-error"></span> <br/>  
    </div>
    <!--New-->
        <center>
        <p id="showInput"></p>
        </center>

    </center>
</form>

<!--Footer goes here-->
<iframe src="footer.html" width="100%" height="100px" title="footer"></iframe>
<script src="hw4.js"></script> 

<!--creates alert box when requirements not met--> 
<div id="alert-box"> 
    <div id="alert-content">
        <h4>Please fill out all required fields. </h4>
        <button id="close-alert">Ok</button>
    </div>
</div>
</body>
</html>
